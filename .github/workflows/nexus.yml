# Generated by scores-patch-points/scores-patch-points (nexus/gen-ci.mjs) from the nexus manifest. Do not edit by hand:
# change nexus/nexus.json there, regenerate, reinstall. The map's live check fails when this file differs from the generated one.
name: nexus
on:
  push:
  pull_request:
jobs:
  nexus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: the nexus block in CLAUDE.md is the generated block
        run: |
          curl -fsS --retry 3 -o "$RUNNER_TEMP/block.md" https://raw.githubusercontent.com/scores-patch-points/scores-patch-points/main/nexus/blocks/penelope.md
          sed -n '/<!-- nexus:begin/,/<!-- nexus:end -->/p' CLAUDE.md > "$RUNNER_TEMP/have.md"
          diff -u "$RUNNER_TEMP/block.md" "$RUNNER_TEMP/have.md"
      - name: language is read by the reader, not a pattern (nexus rule 8, the text-regex ratchet)
        run: |
          curl -fsS --retry 3 -o .nexus-text-regex-ratchet.mjs https://raw.githubusercontent.com/scores-patch-points/scores-patch-points/main/nexus/guards/text-regex-ratchet.mjs
          if [ -f gym/text-regex-baseline.jsonl ] || [ -f text-regex-baseline.jsonl ]; then node .nexus-text-regex-ratchet.mjs; else
            echo "::notice::the text-regex ratchet checked NOTHING here: this repo has no text-regex-baseline.jsonl. Copy nexus/guards/text-regex-ratchet.mjs, run it with --record --why 'initial baseline', and commit the baseline."; fi
      - name: gate (npm test)
        run: |
          npm test
