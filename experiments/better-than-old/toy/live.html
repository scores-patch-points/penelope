<!doctype html><meta charset=utf-8><title>chat on marks</title><meta name=viewport content="width=device-width,initial-scale=1">
<style>body{font:14px system-ui;margin:0;background:#111;color:#ddd;display:grid;grid-template-columns:1.2fr 1fr;height:100vh}
#l,#r{overflow:auto;padding:12px}#r{border-left:1px solid #333;background:#161616}
.say{color:#8a8;margin:2px 0;font-size:13px}.ask{background:#1d2a3a;border-radius:6px;padding:8px;margin:8px 0}.ans{color:#fc6;font-weight:600}
.sl{font:12px ui-monospace,monospace;color:#9bd;white-space:pre-wrap}.meta{color:#888;font-size:12px}
.stat{position:sticky;top:0;background:#111;padding:6px 0;border-bottom:1px solid #333;font-size:13px}
input{width:70%;padding:6px;background:#222;color:#eee;border:1px solid #444}button{padding:6px 10px}</style>
<div id=l><div class=stat><button onclick="fetch('/play')">play a 100-turn chat</button> <input id=t placeholder="say something or ask (end with ?)" onkeydown="if(event.key=='Enter'){fetch('/say?t='+encodeURIComponent(this.value));this.value=''}"> <span id=s class=meta></span></div><div id=log></div></div>
<div id=r><b>what the model sees on the last question</b> <span class=meta>(fixed window, no history)</span><div id=ctx class=sl style="margin-top:8px">waiting…</div></div>
<script>const log=document.getElementById('log'),ctx=document.getElementById('ctx'),S=document.getElementById('s');let tmax=0;
new EventSource('/events').onmessage=m=>{const e=JSON.parse(m.data),d=document.createElement('div');
if(e.kind=='say'){d.className='say';d.textContent=e.n+'  '+e.text;}
else if(e.kind=='ask'){d.className='ask';d.innerHTML='<div>'+e.n+'  '+e.text+'</div><div class=ans>says → '+(e.answer||'(empty)')+'</div><div class=meta>'+(e.grounded===null?'• the reply states no claim the reader can check · recorded as the utterance':e.grounded?'✔ every claim the reader finds in the reply is among the marks · recorded as the utterance':'✘ a claim in the reply is not among the marks (said as written, flagged, recorded)')+'</div><details><summary class=meta>thinking, written to the log as a thought (INS·Figure, by model, not a claim)</summary><div class=sl>'+(e.thinking||'').replace(/</g,'&lt;')+'</div></details><div class=meta>settled by: <b>'+e.route+'</b> ('+e.competency+') · model calls 1, to state it</div><div class=meta>prompt '+e.ptoks+' tokens · '+e.ms+' ms · slice '+e.slice.length+' marks</div>';
ctx.textContent=(e.finding?'[system] Finding ('+e.route+'): '+e.finding+'\n\n':'[system] answer only from the notes…\n\nNotes:\n'+(e.slice.join('\n')||'(no marks)'))+'\n\nREGISTER the machine holds:\n'+(e.register||[]).join('\n')+'\n\nQuestion: '+e.text;tmax=Math.max(tmax,e.ptoks||0);}
else if(e.kind=='tree'){d.className='ask';d.id='card'+e.n;window.COL={stands:'#7c7',contradicted:'#f66',hole:'#fc6',judgement:'#9bd',gap:'#c9c',candidate:'#6cf'};d.innerHTML='<div>'+e.n+'  '+e.text.replace(/</g,'&lt;')+'</div><div class=meta>read into EOT, reasoned mechanically BEFORE any model call: '+e.nodes.filter(n=>n.standing).length+' goals</div><div id=goals'+e.n+'>'+e.nodes.filter(n=>n.standing).map(n=>'<div class=sl id=\"gl'+n.id+'\" style=\"margin:4px 0 0 '+(n.role==='conjunct'||n.role==='part'?18:6)+'px\"><span class=st style=\"color:'+COL[n.standing]+'\">'+n.standing+'</span> ['+n.role+(n.lead?':'+n.lead:'')+'] '+(n.text||'').replace(/</g,'&lt;')+'<br><span class=meta>'+(n.finding||n.note||'').replace(/</g,'&lt;')+'</span>'+(n.basis?'<br><span class=meta>basis · material: '+(n.basis.material||[]).join(', ')+' · priors: '+(n.basis.priors||[]).map(p=>p.kind+(p.rel?'('+p.rel+')':'')+' by '+p.giver).join(', ')+'</span>':'')+'<div class=th></div></div>').join('')+'</div><div class=fin></div>';}
else if(e.kind=='think'){const el=document.getElementById('gl'+e.id);if(el){const st=el.querySelector('.st');st.textContent=e.standing;st.style.color=COL[e.standing];el.querySelector('.th').innerHTML='<details><summary class=meta>the fold\'s thought about this goal (the machine\'s derivation trace, written to the log)</summary>'+(e.thought.steps||[]).map(x=>'<div class=sl>'+x.step+' · '+String(x.rule).replace(/</g,'&lt;')+(x.out?' → '+String(x.out).replace(/</g,'&lt;'):'')+'</div>').join('')+'</details>'+(e.nominated?'<div class=meta>the model only nominated: '+e.nominated.said.replace(/</g,'&lt;')+'</div>':'')+(e.proposals||[]).map(p=>'<div class=meta>proposal '+p.claim.a+' '+p.claim.rel+' '+p.claim.b+' → <b>'+p.status+'</b>: '+p.why+'</div>').join('');}d=null;}
else if(e.kind=='final'){const c=document.getElementById('card'+e.n);if(c){c.querySelector('.fin').innerHTML='<div class=ans style=\"margin-top:8px\">says → '+(e.answer||'').replace(/</g,'&lt;')+'</div><div class=meta>log entries '+e.entries+'</div>';ctx.textContent='[system] The machine checked each part:\n'+e.table+'\n\nQuestion: '+e.text;}d=null;}
else if(e.kind=='done'){d.className='meta';d.textContent='— scripted chat finished —';}
else {d.className='meta';d.textContent=e.text||e.kind;}
if(e.claims!=null)S.textContent='turn '+e.n+' · marks '+e.claims+' · history held by the model: 0 · chat so far '+Math.round(e.historyChars/4)+' tokens · max prompt '+tmax;
if(d)log.appendChild(d);document.getElementById('l').scrollTop=1e9;};</script>
